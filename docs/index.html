<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lucie Verdet Clay Workshops</title>
    <meta name="description" content="Links for Lucie Verdet's clay workshop booking site and admin.">
    <style>
      :root {
        color-scheme: light;
        --ink: #241d19;
        --muted: #6f625b;
        --paper: #f8f2e8;
        --chalk: #fffaf1;
        --clay: #a64f36;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
        background: linear-gradient(135deg, #fff8ec 0%, #f6e6d4 52%, #dfe8df 100%);
        color: var(--ink);
      }
      main {
        width: min(100%, 760px);
        border: 1px solid rgba(36, 29, 25, 0.16);
        border-radius: 8px;
        background: rgba(255, 250, 241, 0.92);
        padding: clamp(28px, 6vw, 56px);
        box-shadow: 0 24px 80px rgba(61, 42, 29, 0.18);
      }
      p {
        color: var(--muted);
        font-size: 1.08rem;
        line-height: 1.55;
      }
      h1 {
        margin: 0 0 16px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.6rem, 7vw, 5.5rem);
        font-weight: 500;
        line-height: 1;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 28px;
      }
      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--ink);
        border-radius: 999px;
        padding: 0 22px;
        color: inherit;
        font-weight: 800;
        text-decoration: none;
      }
      a.primary {
        background: var(--ink);
        color: var(--chalk);
      }
      small {
        display: block;
        margin-top: 24px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Lucie Verdet Clay Workshops</h1>
      <p>The live booking calendar and admin tools run on the deployed Worker site so workshop availability, bookings, and admin login can stay server-side and private.</p>
      <div class="actions">
        <a class="primary" href="https://lucie-verdet-clay-workshops.emilxavierthorsen.chatgpt.site/booking">Open booking site</a>
        <a href="https://lucie-verdet-clay-workshops.emilxavierthorsen.chatgpt.site/admin">Open admin</a>
      </div>
      <small>Admin credentials are not stored in this GitHub Pages site.</small>
    </main>
  </body>
</html>
